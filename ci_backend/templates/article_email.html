<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ title }}</title>
  </head>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5;">
    <h2>{{ title }}</h2>
    {% if company %}<p><strong>Company:</strong> {{ company }}</p>{% endif %}
    {% if source_url %}<p><a href="{{ source_url }}">Open source</a></p>{% endif %}
    <div>{{ content | e }}</div>
  </body>
</html>
